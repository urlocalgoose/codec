# Codec sync server. Set CODEC_AUTH_TOKEN before exposing it anywhere
# beyond localhost, and put HTTPS (Caddy, nginx, a Cloudflare Tunnel)
# in front for public access.
services:
  codec:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      - CODEC_AUTH_TOKEN=${CODEC_AUTH_TOKEN:?Set CODEC_AUTH_TOKEN before starting Codec}
    volumes:
      - codec-data:/data
    restart: unless-stopped

volumes:
  codec-data:
