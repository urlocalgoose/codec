name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build release zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: sync-server/go.mod

      - name: Cross-compile server and package
        run: |
          set -euo pipefail
          mkdir -p dist
          targets="darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64"
          for target in $targets; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="codec-${goos}-${goarch}"
            stage="dist/${name}"
            mkdir -p "$stage"
            bin="codec-sync-server"
            [ "$goos" = "windows" ] && bin="codec-sync-server.exe"
            (cd sync-server && CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o "../${stage}/${bin}" ./cmd/codec-sync-server)
            cp -R build "${stage}/web"
            cat > "${stage}/START-HERE.txt" <<'EOF'
          Codec — quick start

          1. Run the server:
               macOS / Linux:  ./codec-sync-server
               Windows:        codec-sync-server.exe

             First run asks three questions (folder, port, auth token) and
             prints the URLs to open. Your answers live in ~/.codec/server.json;
             run with --setup to change them later.

             macOS may block the first launch (unsigned binary): right-click
             the file, Open, then confirm — or run
               xattr -d com.apple.quarantine codec-sync-server

          2. Open the printed URL in a browser. Paste the token when asked.
             On your phone, use the LAN address and Add to Home Screen.

          3. Add music: Settings -> Import music (MP3s or a loud.import.v1
             manifest), or point the desktop app at your music folder.

          Docs and source: https://github.com/urlocalgoose/codec
          EOF
            (cd dist && zip -qr "${name}.zip" "$name" && rm -rf "$name")
          done
          ls -la dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "Codec ${GITHUB_REF_NAME}" \
            --generate-notes

  desktop:
    name: Desktop app (${{ matrix.label }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux webview dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - run: bun install --frozen-lockfile

      - name: Build desktop app (macOS)
        if: matrix.label == 'macos'
        run: |
          bun run tauri build --bundles app
          ditto -c -k --keepParent \
            src-tauri/target/release/bundle/macos/Codec.app \
            "src-tauri/target/release/bundle/macos/Codec-desktop-macos-arm64.app.zip"

      - name: Build desktop app (Linux)
        if: matrix.label == 'linux'
        run: bun run tauri build --bundles appimage,deb

      - name: Build desktop app (Windows)
        if: matrix.label == 'windows'
        run: bun run tauri build --bundles nsis

      - name: Upload desktop bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(
            src-tauri/target/release/bundle/macos/*.app.zip
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
          )
          for bundle in "${bundles[@]}"; do
            renamed="$(dirname "$bundle")/$(basename "$bundle" | tr ' ' '-')"
            [ "$bundle" = "$renamed" ] || mv "$bundle" "$renamed"
            gh release upload "${GITHUB_REF_NAME}" "$renamed" --clobber
          done
