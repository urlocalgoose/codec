name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # One zip per platform: the server, the web app, and the desktop app
  # together. Running the server binary walks you through installing
  # whichever pieces you want.
  bundle:
    name: Bundle (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
            goos: darwin
            goarch: arm64
          - os: ubuntu-latest
            label: linux-amd64
            goos: linux
            goarch: amd64
          - os: windows-latest
            label: windows-amd64
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: sync-server/go.mod

      - name: Linux webview dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Build server
        shell: bash
        run: |
          bin="codec-sync-server"; [ "${{ matrix.goos }}" = "windows" ] && bin="codec-sync-server.exe"
          (cd sync-server && CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "../dist-bin/${bin}" ./cmd/codec-sync-server)

      - name: Build desktop app (macOS)
        if: matrix.goos == 'darwin'
        run: bun run tauri build --bundles app
      - name: Build desktop app (Linux)
        if: matrix.goos == 'linux'
        run: bun run tauri build --bundles appimage,deb
      - name: Build desktop app (Windows)
        if: matrix.goos == 'windows'
        run: bun run tauri build --bundles nsis

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          name="codec-${{ matrix.label }}"
          stage="dist/${name}"
          mkdir -p "$stage"
          cp dist-bin/* "$stage/"
          cp -R build "$stage/web"
          case "${{ matrix.goos }}" in
            darwin)
              cp -R src-tauri/target/release/bundle/macos/Codec.app "$stage/Codec.app" ;;
            linux)
              for f in src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb; do
                cp "$f" "$stage/$(basename "$f" | tr ' ' '-')"
              done ;;
            windows)
              for f in src-tauri/target/release/bundle/nsis/*.exe; do
                cp "$f" "$stage/Codec-setup.exe"
              done ;;
          esac
          cat > "$stage/START-HERE.txt" <<'TXT'
          Codec — everything in one folder

          Run the server binary and answer a few questions:
            macOS / Linux:  ./codec-sync-server
            Windows:        codec-sync-server.exe

          It asks whether to install the desktop app, whether to run the
          server on this computer (and where, on what port, with what token —
          generated for you), and whether to start the server at login. Then
          it prints the URL to open and your token.

          macOS may block the first launch of an unsigned download: right-click
          the file, Open, then confirm — or run
            xattr -d com.apple.quarantine codec-sync-server

          Docs and source: https://github.com/urlocalgoose/codec
          TXT
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && 7z a -tzip -r "${name}.zip" "$name" > /dev/null)
          else
            (cd dist && zip -qr "${name}.zip" "$name")
          fi
          rm -rf "$stage"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: dist/*.zip

  # Headless boxes (a Pi, an Intel Mac mini in a closet) get server-only zips.
  server-only:
    name: Server-only zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: sync-server/go.mod
      - name: Cross-compile
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/amd64 linux/arm64; do
            goos="${target%/*}"; goarch="${target#*/}"
            name="codec-server-${goos}-${goarch}"
            stage="dist/${name}"; mkdir -p "$stage"
            (cd sync-server && CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o "../${stage}/codec-sync-server" ./cmd/codec-sync-server)
            cp -R build "${stage}/web"
            printf 'Server-only build. Run ./codec-sync-server and answer the questions.\n' > "${stage}/START-HERE.txt"
            (cd dist && zip -qr "${name}.zip" "$name" && rm -rf "$name")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: server-only
          path: dist/*.zip

  release:
    name: Publish release
    needs: [bundle, server-only]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          gh release create "${GITHUB_REF_NAME}" artifacts/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Codec ${GITHUB_REF_NAME}" \
            --generate-notes
