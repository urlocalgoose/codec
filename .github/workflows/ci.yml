name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (svelte-check, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test src/lib
      - run: bun run build

  server:
    name: Go sync server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sync-server/go.mod
      - run: go vet ./...
        working-directory: sync-server
      - run: go test ./...
        working-directory: sync-server

  rust:
    name: Rust core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  ios:
    name: CodecKit (swift test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: ios/CodecMobile
