<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Codec link-preview image source</title>
<style>
*{box-sizing:border-box}
body{margin:0;width:1200px;height:630px;overflow:hidden;background:#101312;color:#eef2ed;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
.copy{position:absolute;left:64px;top:64px;width:560px}
.brand{display:flex;align-items:center;gap:20px;font-size:44px;font-weight:650;letter-spacing:-1.5px}
.brand img{width:76px;height:76px;border-radius:18px}
h1{margin:56px 0 0;font-size:72px;line-height:1.06;font-weight:700;letter-spacing:-3px}
.domain{margin:70px 0 0;color:#b6beb8;font-size:27px;letter-spacing:-.4px}
.phone{position:absolute;width:222px;padding:7px;border-radius:34px;background:#090b0a;border:2px solid #353c37;box-shadow:0 16px 42px #0005}
.phone img{display:block;width:100%;height:auto;border-radius:25px}
.library{left:666px;top:53px}
.playing{left:916px;top:113px}
</style>
<main>
  <div class="copy">
    <div class="brand"><img src="assets/codec-mark.webp" alt="">Codec</div>
    <h1>Self-hosted<br>music player.</h1>
    <p class="domain">codec.codie.sh</p>
  </div>
  <div class="phone library"><img src="assets/iphone-library.webp" alt="Codec Library"></div>
  <div class="phone playing"><img src="assets/iphone-now-playing.webp" alt="Codec Now Playing"></div>
</main>
</html>
